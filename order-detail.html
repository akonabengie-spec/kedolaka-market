<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order details | KEDOLAKA MARKET</title>
    <meta name="description" content="Review your KEDOLAKA MARKET order and pending payment record." />
  <link rel="icon" type="image/svg+xml" href="/assets/kedolaka-market-icon.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#123f35">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/market-theme.css">
  <link rel="stylesheet" href="/css/pages/orders.css">
</head>
  <body data-requires-auth="true">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand brand-logo-link" href="/" aria-label="KEDOLAKA MARKET home"><img class="brand-logo" src="/assets/kedolaka-market-compact.svg" alt="KEDOLAKA MARKET"></a>
        <nav class="main-nav" aria-label="Main navigation"><a href="index.html">Marketplace</a><a href="orders.html">Orders</a><a href="cart.html">Cart</a><a href="account.html">Account</a></nav>
      </div>
    </header>
    <main id="orderDetail" class="order-shell" aria-live="polite">
      <p id="orderLoading">Loading order details...</p>
      <section class="order-panel">
        <h1 id="orderTitle">Order details</h1>
        <p id="orderStatus" class="order-status"></p>
        <p><a id="orderPaymentLink" href="payment-status.html">View payment status</a></p>
        <h2>Items</h2>
        <ul id="orderItems" class="order-items"></ul>
        <h2>Delivery</h2>
        <p id="orderDelivery"></p>
        <p id="orderFreight"></p>
        <p id="orderShipment"></p>
        <p id="orderRefunds"></p>
        <h2>Payment</h2>
        <p id="orderPaymentMethod"></p>
        <p id="orderPaymentInstructions" class="vendor-payment-details"></p>
        <p id="orderPaymentReferenceContacts"></p>
        <p id="orderTotal"></p>
        <button id="cancelOrderButton" class="btn btn-secondary" type="button" hidden>Cancel pending order</button>
        <p id="orderActionStatus" aria-live="polite"></p>
        <a class="btn btn-secondary" href="orders.html">Back to orders</a>
      </section>
    </main>
    <script src="/js/marketplace.js"></script>
  </body>
</html>
